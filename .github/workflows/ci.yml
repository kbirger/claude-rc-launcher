name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
      # The backend test files still have lint errors, so they are left out until they are typed.
      - run: bun run lint:source
      - run: bun run --cwd web check
      - run: bun run test
      - run: bun run build

  # The Windows node: its PowerShell scripts (installer, launcher) only run on Windows, and the build must work there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: >-
          bun test server/test/config/parse.win.test.ts server/test/win/WinInstances.test.ts server/test/win/trust.test.ts
          server/test/win/update.test.ts server/test/win-install.test.ts server/test/win-launcher.test.ts
          server/test/win-path.test.ts server/test/win-bootstrap.test.ts server/test/win/token.test.ts
          server/test/hosts/NodeEvents.test.ts server/test/app.node.test.ts server/test/win/definition.test.ts
          server/test/sessions/files.test.ts server/test/sessions/SessionCatalog.test.ts server/test/sessions/PinnedRoot.test.ts
          server/test/instances/ChangeLock.test.ts server/test/instances/settings.test.ts
      - run: bun run build:win
