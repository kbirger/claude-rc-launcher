name: Release

# Push a tag like v0.1.0 to build prebuilt Linux binaries and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test
      - name: Build web bundle and embed it
        run: bun run build:bundle
      - name: Compile binaries
        run: |
          mkdir -p dist
          for target in x64 arm64; do
            bun build --compile --target=bun-linux-$target server/src/index.ts \
              --outfile dist/claude-rc-launcher-linux-$target
          done
          (cd dist && sha256sum claude-rc-launcher-linux-* > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
