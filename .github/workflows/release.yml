name: Release

# Start this workflow by hand from the Actions tab (Run workflow) to build the prebuilt binaries (Linux server,
# command-line client, Windows node and its installer) and publish them as a GitHub release. git-cliff works out the
# next version and writes the release notes. Run it with dry_run first: it prints the version and the notes and
# creates nothing. Pushing a tag like v0.1.0 still works as a fallback.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the version and the notes only. Create nothing.
        type: boolean
        default: true
      version:
        description: Optional. Overrides the computed version, for example 1.0.0
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a run from a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Run this workflow from the main branch. This run uses $REF."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Work out the version and the notes
        id: rel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
                echo "::error::The version input is not a version like 1.2.3 or v1.2.3."
                exit 1
              fi
              tag="v${INPUT_VERSION#v}"
            else
              bumped="$(bunx git-cliff --config cliff.toml --bumped-version)"
              tag="v${bumped#v}"
              latest="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
              if [ "$tag" = "$latest" ]; then
                echo "Nothing to release since $latest."
                echo "Nothing to release since $latest." >> "$summary"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::The tag $tag exists already."
              exit 1
            fi
            prev="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            cliff_args=(--unreleased --tag "$tag")
          else
            tag="$GITHUB_REF_NAME"
            prev="$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)"
            cliff_args=(--latest)
          fi
          if out="$(bunx git-cliff --config cliff.toml "${cliff_args[@]}")"; then
            if [ -z "${out//[[:space:]]/}" ]; then
              out="No user-visible changes."
            fi
          else
            echo "::warning::git-cliff failed. The release notes link to the compare view."
            out="Changes: https://github.com/$REPO/compare/${prev:-$tag}...$tag"
          fi
          printf '%s\n' "$out" > "$notes"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          {
            echo "## Release $tag"
            echo
            cat "$notes"
          } | tee -a "$summary"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "Dry run: nothing is built or published."
            echo "Dry run: nothing is built or published." >> "$summary"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rel.outputs.publish == 'true'
        run: bun install --frozen-lockfile
        working-directory: web
      - if: steps.rel.outputs.publish == 'true'
        run: bun run test
      - name: Build web bundle and embed it
        if: steps.rel.outputs.publish == 'true'
        run: bun run build:bundle
      - name: Compile binaries
        if: steps.rel.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          mkdir -p dist
          version="$(bun scripts/version.ts)"
          for target in x64 arm64; do
            bun build --compile --target=bun-linux-$target --define "BUILD_VERSION=\"$version\"" server/src/index.ts \
              --outfile dist/claude-rc-launcher-linux-$target
          done
          # The command-line client runs on laptops, so it is built for more platforms than the server.
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$target" = "windows-x64" ] && ext=".exe"
            bun build --compile --target=bun-$target --define "BUILD_VERSION=\"$version\"" cli/src/index.ts \
              --outfile dist/claude-rc-$target$ext
          done
          # The Windows node. install.ps1 needs the files next to it, so they travel together as one zip.
          bun build --compile --target=bun-windows-x64 --define "BUILD_VERSION=\"$version\"" server/src/index.win.ts \
            --outfile dist/claude-rc-launcher-win-x64.exe
          (cd deploy/windows && zip -q -j ../../dist/claude-rc-launcher-win-installer.zip \
            install.ps1 claude-rc-launcher.xml claude-rc-launcher-run.ps1 node.config.example.toml)
          # The one-line installer: `irm .../releases/latest/download/install.ps1 | iex`. It fetches the zip above.
          cp deploy/windows/install.ps1 dist/install.ps1
          cp install-cli.sh dist/install-cli.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # On a dispatch run the tag does not exist yet. gh creates it at this commit.
        run: gh release create "$RELEASE_TAG" dist/* --notes-file "$RUNNER_TEMP/notes.md" --title "$RELEASE_TAG" --target "$GITHUB_SHA"
