name: Release

# Push a tag like v0.1.0 to build the prebuilt binaries (Linux server, command-line client, Windows node and its
# installer) and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run test
      - name: Build web bundle and embed it
        run: bun run build:bundle
      - name: Compile binaries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          version="$(bun scripts/version.ts)"
          for target in x64 arm64; do
            bun build --compile --target=bun-linux-$target --define "BUILD_VERSION=\"$version\"" server/src/index.ts \
              --outfile dist/claude-rc-launcher-linux-$target
          done
          # The command-line client runs on laptops, so it is built for more platforms than the server.
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$target" = "windows-x64" ] && ext=".exe"
            bun build --compile --target=bun-$target --define "BUILD_VERSION=\"$version\"" cli/src/index.ts \
              --outfile dist/claude-rc-$target$ext
          done
          # The Windows node. install.ps1 needs the files next to it, so they travel together as one zip.
          bun build --compile --target=bun-windows-x64 --define "BUILD_VERSION=\"$version\"" server/src/index.win.ts \
            --outfile dist/claude-rc-launcher-win-x64.exe
          (cd deploy/windows && zip -q -j ../../dist/claude-rc-launcher-win-installer.zip \
            install.ps1 claude-rc-launcher.xml claude-rc-launcher-run.ps1 node.config.example.toml)
          # The one-line installer: `irm .../releases/latest/download/install.ps1 | iex`. It fetches the zip above.
          cp deploy/windows/install.ps1 dist/install.ps1
          cp install-cli.sh dist/install-cli.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
