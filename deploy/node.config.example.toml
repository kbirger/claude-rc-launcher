# claude-rc-launcher NODE configuration: this host is managed by a hub; it has no UI and no user login.
# Secrets are never written here. Placeholder values (example.com, replace-with-...) must be replaced
# before the service starts.

mode = "node"
# name = "pi"                             # display name; default: hostname
port = 8443
host = "10.0.0.9"                         # bind a PRIVATE interface, not 0.0.0.0 on a public host

[instance]
# roots = ["/home/pi/projects"]           # absolute directories the hub may browse/start in; default [service_home]
# scope = "system"
# service_user = "root"
# service_home = "/root"
# claude_bin = "/root/.local/bin/claude"

[tls]
# Holds node-cert.pem (copy this to the hub as its ca_file) and node-key.pem (never leaves this host).
# The certificate is generated on first start and reused afterwards so the hub's pin stays valid.
state_dir = "/var/lib/claude-rc-launcher"
names = ["pi.example.com", "10.0.0.9"]    # certificate SANs: the DNS names / IPs the hub connects to

# Enable at least one of the two methods below.

# Hub public key: the hub signs every request with its private key and the node checks the signature.
# Get the line from the output of `claude-rc node config` or from `GET /cli/api/node-enrollment` on the hub.
# Repeat the table to trust more than one hub key.
# [[node_auth.hub_key]]
# public_key = "replace-with-the-hub-public-key"

# Shared secret: run `claude-rc-launcher gen-secret`, put the secret on the hub, the sha256 here.
# Repeat the table to accept two secrets during rotation.
# [[node_auth.secret]]
# sha256 = "replace-with-64-hex-chars-from-gen-secret"
